<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🌱 제철 식단 도우미 (개선판)</title>
    <style>
        :root {
            --primary: #2e7d32;
            --primary-light: #e8f5e9;
            --secondary: #d84315;
            --bg: #f9fbf8;
            --card-bg: #ffffff;
            --text: #2c3e50;
            --border: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 16px;
            max-width: 680px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 24px 16px;
            background: linear-gradient(135deg, #2e7d32, #43a047);
            color: white;
            border-radius: 16px;
            margin-bottom: 20px;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.15);
        }

        header h1 {
            font-size: 1.6rem;
            margin-bottom: 6px;
        }

        header p {
            font-size: 0.95rem;
            opacity: 0.9;
        }

        .controls-panel {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            background: var(--card-bg);
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .month-select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 0.95rem;
            font-weight: bold;
            color: var(--primary);
            background: white;
            cursor: pointer;
        }

        .toggle-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
            background: #eee;
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            border: none;
            transition: all 0.2s;
        }

        .toggle-btn.active {
            background: var(--primary);
            color: white;
        }

        .card {
            background: var(--card-bg);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }

        .card-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 1.2rem;
            margin-bottom: 14px;
            color: var(--primary);
            border-bottom: 2px solid var(--primary-light);
            padding-bottom: 8px;
        }

        .shopping-list {
            list-style: none;
        }

        .shopping-item {
            display: flex;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px stroke #f0f0f0;
        }

        .shopping-item input[type="checkbox"] {
            width: 20px;
            height: 20px;
            margin-right: 12px;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .shopping-item label {
            cursor: pointer;
            flex: 1;
            font-size: 0.95rem;
        }

        .shopping-item input[type="checkbox"]:checked + label {
            text-decoration: line-through;
            color: #888;
        }

        .btn-action {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            margin-top: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-action:hover {
            background: #d4edda;
        }

        .timeline {
            margin-top: 12px;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 8px;
            font-size: 0.9rem;
        }

        .timeline-step {
            margin-bottom: 6px;
            display: flex;
            gap: 8px;
        }

        .timeline-time {
            font-weight: bold;
            color: var(--secondary);
            min-width: 55px;
        }

        .badge {
            background: #ffecb3;
            color: #8f6b00;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            margin-left: 6px;
        }
    </style>
</head>
<body>

    <header>
        <h1>🌱 제철 식단 도우미</h1>
        <p>4인 가구 · 고기 메인 · 초보자 1시간 컷</p>
    </header>

    <div class="controls-panel">
        <div>
            <label for="monthSelect">📅 월 선택: </label>
            <select id="monthSelect" class="month-select" onchange="renderApp()">
                <!-- JS로 월 추가됨 -->
            </select>
        </div>
        <button id="wakeLockBtn" class="toggle-btn" onclick="toggleWakeLock()">
            💡 화면 켜짐 유지 OFF
        </button>
    </div>

    <!-- 1주일 추천 기본 장보기 -->
    <div class="card">
        <div class="card-title">
            <span>🛒 <span id="monthTitle"></span> 1주일 장보기</span>
        </div>
        <ul id="shoppingList" class="shopping-list">
            <!-- JS로 동적 추가 -->
        </ul>
        <button class="btn-action" onclick="copyShoppingList()">📋 장보기 목록 복사하기</button>
    </div>

    <!-- 오늘의 추천 식단 -->
    <div class="card">
        <div class="card-title">
            <span>🍲 오늘의 추천 식단</span>
            <button style="background:none; border:none; cursor:pointer; font-size:0.9rem; color:#666;" onclick="randomizeMenu()">🔄 메뉴 변경</button>
        </div>
        <div id="menuContent">
            <!-- JS로 동적 추가 -->
        </div>

        <div class="timeline">
            <strong>⏱️ 1시간 컷 초보 조리 동선 (타임라인)</strong>
            <div id="timelineSteps" style="margin-top: 8px;">
                <!-- JS로 동적 추가 -->
            </div>
        </div>
    </div>

    <script>
        // 월별 제철 데이터베이스
        const seasonalData = {
            3: {
                veggies: "봄동 1포기, 냉이 100g, 달래 1단, 부추 1단, 시금치 1단, 대파, 양파, 감자",
                meat: "돼지고기(제육용 600g, 찌개용 300g), 소불고기용 600g, 닭볶음탕용 1kg, 훈제오리 500g",
                staples: "두부 2모, 계란 1판, 어묵 1봉, 느타리버섯 1팩, 콩나물 1봉",
                menu: {
                    main: "달래 향 가득 돼지 제육볶음 (600g)",
                    soup: "냉이 바지락 된장찌개",
                    side: "봄동 겉절이, 계란찜",
                    sub: "봄동 대신 배추나 청경채 활용 가능"
                }
            },
            4: {
                veggies: "취나물 1단, 두릅 200g, 부추 1단, 애호박 1개, 양파, 대파, 마늘",
                meat: "돼지목살 600g, 소불고기용 600g, 닭가슴살 500g, 훈제오리 500g",
                staples: "두부 2모, 계란 1판, 팽이버섯 2팩, 콩나물 1봉",
                menu: {
                    main: "단짠 간장 소불고기 (600g)",
                    soup: "칼칼한 애호박 두부찌개",
                    side: "취나물 무침, 부추전",
                    sub: "취나물 대신 시금치 활용 가능"
                }
            },
            // 기본값 (기타 월 공통 처리)
            default: {
                veggies: "시금치, 애호박, 감자, 대파, 양파, 느타리버섯, 콩나물",
                meat: "돼지고기(제육/찌개용 900g), 소불고기용 600g, 훈제오리 500g",
                staples: "두부 2모, 계란 1판, 어묵 1봉",
                menu: {
                    main: "매콤 돼지 제육볶음 (600g)",
                    soup: "진한 두부 김치찌개",
                    side: "계란말이, 콩나물 무침",
                    sub: "느타리버섯 대신 새송이버섯 활용 가능"
                }
            }
        };

        const timelineTemplate = [
            { time: "0~10분", step: "밥 앉히기, 육수 물 끓이기, 고기 양념 재우기" },
            { time: "10~25분", step: "채소 세척 및 썰기, 국/찌개 재료 넣고 끓이기 시작" },
            { time: "25~45분", step: "메인 고기 요리 강불에서 볶기 / 계란찜/부추전 준비" },
            { time: "45~60분", step: "찌개 간 맞추기, 밑반찬 접시 담기 및 상차림 완료!" }
        ];

        let wakeLock = null;

        // 초기화
        window.onload = () => {
            initMonthSelect();
            renderApp();
        };

        function initMonthSelect() {
            const select = document.getElementById('monthSelect');
            const currentMonth = new Date().getMonth() + 1;

            for (let i = 1; i <= 12; i++) {
                const opt = document.createElement('option');
                opt.value = i;
                opt.textContent = `${i}월`;
                if (i === currentMonth) opt.selected = true;
                select.appendChild(opt);
            }
        }

        function renderApp() {
            const month = document.getElementById('monthSelect').value;
            const data = seasonalData[month] || seasonalData.default;

            document.getElementById('monthTitle').textContent = `${month}월`;

            // 장보기 리스트 출력
            const shoppingListEl = document.getElementById('shoppingList');
            shoppingListEl.innerHTML = `
                <li class="shopping-item">
                    <input type="checkbox" id="item1"><label for="item1"><b>고기류:</b> ${data.meat}</label>
                </li>
                <li class="shopping-item">
                    <input type="checkbox" id="item2"><label for="item2"><b>제철 채소:</b> ${data.veggies}</label>
                </li>
                <li class="shopping-item">
                    <input type="checkbox" id="item3"><label for="item3"><b>필수 재료:</b> ${data.staples}</label>
                </li>
            `;

            // 오늘의 식단 출력
            renderMenu(data.menu);

            // 타임라인 출력
            const timelineEl = document.getElementById('timelineSteps');
            timelineEl.innerHTML = timelineTemplate.map(t => `
                <div class="timeline-step">
                    <span class="timeline-time">${t.time}</span>
                    <span>${t.step}</span>
                </div>
            `).join('');
        }

        function renderMenu(menu) {
            const menuEl = document.getElementById('menuContent');
            menuEl.innerHTML = `
                <p style="font-size:1.1rem; font-weight:bold; margin-bottom:6px;">🥩 메인: ${menu.main}</p>
                <p style="font-size:1rem; margin-bottom:6px;">🍲 국/찌개: ${menu.soup}</p>
                <p style="font-size:0.95rem; color:#555; margin-bottom:8px;">🥗 밑반찬: ${menu.side}</p>
                <p style="font-size:0.85rem; color:#777;">💡 <i>대체 팁: ${menu.sub}</i></p>
            `;
        }

        function randomizeMenu() {
            const sampleMenus = [
                { main: "훈제오리 부추볶음 (500g)", soup: "맑은 콩나물국", side: "계란말이, 오이무침", sub: "부추 대신 양파/양배추 채썰어 활용" },
                { main: "춘천식 닭갈비 (1kg)", soup: "계란파국", side: "쌈채소, 콘샐러드", sub: "닭고기 대신 돼지 불고기용 변경 가능" },
                { main: "돼지고기 간장 불고기 (600g)", soup: "아욱 된장국", side: "부추 겉절이, 어묵볶음", sub: "아욱 대신 근대/시금치 가능" }
            ];
            const random = sampleMenus[Math.floor(Math.random() * sampleMenus.length)];
            renderMenu(random);
        }

        function copyShoppingList() {
            const month = document.getElementById('monthSelect').value;
            const data = seasonalData[month] || seasonalData.default;
            const text = `[${month}월 4인가구 장보기 리스트]\n- 고기류: ${data.meat}\n- 제철채소: ${data.veggies}\n- 기타: ${data.staples}`;

            navigator.clipboard.writeText(text).then(() => {
                alert('장보기 목록이 클립보드에 복사되었습니다! 카톡이나 메모장에 붙여넣으세요.');
            });
        }

        // 화면 켜짐 유지 (Wake Lock API)
        async function toggleWakeLock() {
            const btn = document.getElementById('wakeLockBtn');
            if (!wakeLock) {
                try {
                    wakeLock = await navigator.wakeLock.request('screen');
                    btn.classList.add('active');
                    btn.textContent = '💡 화면 켜짐 유지 ON';
                } catch (err) {
                    alert('이 브라우저에서는 화면 켜짐 유지 기능을 지원하지 않습니다.');
                }
            } else {
                wakeLock.release();
                wakeLock = null;
                btn.classList.remove('active');
                btn.textContent = '💡 화면 켜짐 유지 OFF';
            }
        }
    </script>
</body>
</html>
